{% extends "core/dashboard/base.html" %}
{% block dashboard_title %}Delete category{% endblock %}
{% block dashboard_content %}
<div class="dash-panel" style="max-width:480px;">
    <h2 class="h5 fw-bold mb-3">Delete “{{ category.name }}”?</h2>
    <p class="text-secondary">Questions in this category will keep their data but lose the category link.</p>
    <form method="post" class="d-flex gap-2">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'dashboard_categories' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
