<div class="dash-page-header d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
    <div>
        <h1 class="dash-page-title">{{ title }}</h1>
        {% if subtitle %}<p class="dash-page-subtitle text-secondary mb-0">{{ subtitle }}</p>{% endif %}
    </div>
    {% if action_url %}
    <a href="{{ action_url }}" class="btn btn-dash-primary">
        {% if action_icon %}<i class="bi {{ action_icon }}"></i>{% endif %}
        {{ action_label }}
    </a>
    {% endif %}
</div>
