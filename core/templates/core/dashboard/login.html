{% extends "base.html" %}
{% block title %}Staff Login{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 420px;">
    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4">
            <h3 class="fw-bold mb-1" style="color:#0A2F1F;">Dashboard Login</h3>
            <p class="text-secondary small mb-4">Pastors and administrators only.</p>
            <form method="post">
                {% csrf_token %}
                {% if form.non_field_errors %}
                <div class="alert alert-danger">{{ form.non_field_errors }}</div>
                {% endif %}
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    {{ form.username }}
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    {{ form.password }}
                </div>
                <button type="submit" class="btn w-100 rounded-pill" style="background:#D4AF37;color:#0A2F1F;font-weight:600;">Sign in</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
