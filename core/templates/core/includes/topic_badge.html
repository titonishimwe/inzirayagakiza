{% if item.category %}
<a href="{% url 'topic_hub' item.category.slug %}" class="badge rounded-pill text-decoration-none" style="background:rgba(10,47,31,0.08);color:#0A2F1F;font-size:0.7rem;font-weight:600;">
    <i class="bi {{ item.category.icon }}"></i> {{ item.category.name }}
</a>
{% endif %}
