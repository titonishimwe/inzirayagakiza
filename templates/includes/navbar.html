<div class="container d-md-none mt-2 px-3" style="margin-top: 10px !important;">
    <form class="d-flex" role="search" action="/search/">
        <input class="form-control me-2" type="search" placeholder="Search sermons, articles..." name="q">

</div>

<script>
    // enable tooltips
    var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
    var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl)
    })
    // active link highlight based on current path (simple)
    document.addEventListener("DOMContentLoaded", function() {
        let currentPath = window.location.pathname;
        document.querySelectorAll('.nav-link').forEach(link => {
            let href = link.getAttribute('href');
            if(href && href !== '/' && currentPath.startsWith(href) && href !== '#') {
                link.classList.add('active', 'fw-semibold');
                if(link.classList.contains('dropdown-toggle')) return;
            } else if(href === '/' && currentPath === '/') {
                link.classList.add('active', 'fw-semibold');
            }
        });
    });
</script>
