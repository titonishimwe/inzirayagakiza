{% load i18n %}
<form action="{% url 'set_language' %}" method="post" class="language-switcher">
    {% csrf_token %}
    <input name="next" type="hidden" value="{{ request.get_full_path }}">
    <label for="site-language" class="visually-hidden">{% trans "Language" %}</label>
    <select
        id="site-language"
        name="language"
        class="form-select form-select-sm"
        onchange="this.form.submit()"
        aria-label="{% trans 'Select language' %}"
    >
        {% get_current_language as CURRENT_LANG %}
        {% get_available_languages as AVAILABLE_LANGUAGES %}
        {% for lang_code, lang_name in AVAILABLE_LANGUAGES %}
        <option value="{{ lang_code }}"{% if lang_code == CURRENT_LANG %} selected{% endif %}>
            {{ lang_name }}
        </option>
        {% endfor %}
    </select>
</form>
